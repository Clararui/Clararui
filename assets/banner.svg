<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">第青川 · AI PM · AI 测评与 AI 提效</title>
  <desc id="desc">第青川，AI PM。AI 原住民，专注 AI 测评与 AI 提效。科技紫色网格背景，光晕自动缓缓游移；减少动态效果设置下静止显示。</desc>
  <defs>
    <linearGradient id="base" x2="1" y2="1">
      <stop stop-color="#110b20"/>
      <stop offset=".55" stop-color="#251144"/>
      <stop offset="1" stop-color="#160d2c"/>
    </linearGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#a855f7" stop-opacity=".52"/>
      <stop offset=".42" stop-color="#7c3aed" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reveal">
      <stop stop-color="white"/>
      <stop offset=".36" stop-color="white" stop-opacity=".8"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b898ef" stroke-width=".7"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1278" height="358" rx="20"/></clipPath>
    <mask id="spotlight" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="360">
      <ellipse class="drift" cx="640" cy="170" rx="350" ry="240" fill="url(#reveal)"/>
    </mask>
  </defs>
  <style>
    .sans{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}
    .mono{font-family:Menlo,Consolas,monospace}
    .drift{animation:drift 14s ease-in-out infinite}
    .soft-glow{animation:breathe 8s ease-in-out infinite}
    .flow{stroke-dasharray:80 1072;animation:flow 9s linear infinite}
    .status{animation:breathe 4s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translate(-200px,35px)}35%{transform:translate(180px,-55px)}70%{transform:translate(40px,65px)}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
    @keyframes flow{from{stroke-dashoffset:1152}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.drift,.soft-glow,.flow,.status{animation:none}.flow{opacity:.35}.soft-glow{opacity:.5}}
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="360" fill="url(#base)"/>
    <ellipse class="soft-glow" cx="1100" cy="20" rx="420" ry="340" fill="url(#violet-glow)"/>
    <ellipse class="drift" cx="640" cy="170" rx="440" ry="320" fill="url(#violet-glow)"/>
    <rect width="1280" height="360" fill="url(#grid)" opacity=".09"/>
    <g mask="url(#spotlight)">
      <rect width="1280" height="360" fill="url(#grid)" opacity=".38"/>
      <g class="mono" fill="#dac4ff" opacity=".24" font-size="14" letter-spacing="2">
        <text x="540" y="122" transform="rotate(-6 540 122)">AI NATIVE</text>
        <text x="624" y="191" transform="rotate(5 624 191)">EVALUATION</text>
        <text x="480" y="262" transform="rotate(-4 480 262)">PRODUCTIVITY</text>
      </g>
    </g>
    <path d="M1 64H1279" stroke="#ac86ed" stroke-opacity=".22"/>
    <g class="sans">
      <text x="48" y="40" font-size="14" letter-spacing="2" fill="#c5afe3">GITHUB / CLARARUI</text>
      <circle class="status" cx="1228" cy="33" r="3" fill="#d8b4fe"/>
      <text x="64" y="164" font-size="64" font-weight="700" fill="#faf5ff">第青川</text>
      <text x="66" y="218" font-size="28" fill="#e8d5ff">AI PM</text>
      <text x="66" y="254" font-size="20" fill="#c4acd9">AI 原住民 / AI native</text>
      <path d="M850 116V270" stroke="#a77be1" stroke-opacity=".4"/>
      <text x="914" y="157" font-size="32" font-weight="600" fill="#f3e8ff">AI 测评</text>
      <text x="916" y="190" font-size="18" fill="#c4acd9">AI evaluations</text>
      <text x="914" y="237" font-size="32" font-weight="600" fill="#f3e8ff">AI 提效</text>
      <text x="916" y="270" font-size="18" fill="#c4acd9">AI-powered productivity</text>
    </g>
    <path d="M64 302H1216" stroke="#a77be1" stroke-opacity=".25"/>
    <path class="flow" d="M64 302H1216" stroke="#d8b4fe" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="20" fill="none" stroke="#7955b6" stroke-opacity=".6"/>
</svg>
